
services:
  postgres:
    image: postgres:17
    container_name: enterprise-ai-postgres
    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - enterprise-ai-network

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile

    container_name: enterprise-ai-backend
    restart: unless-stopped

    env_file:
      - ../backend/.env

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432

      DOCUMENT_DATABASE_HOST: postgres
      DOCUMENT_DATABASE_PORT: 5432

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_API_KEY: ${QDRANT_API_KEY}

    ports:
      - "127.0.0.1:8000:8000"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started

    networks:
      - enterprise-ai-network

  redis:
    image: redis:8-alpine
    container_name: enterprise-ai-redis
    restart: unless-stopped

    env_file:
      - .env

    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD}

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        - CMD-SHELL
        - 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG'
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - enterprise-ai-network

  qdrant:
    image: qdrant/qdrant:v1.17.1
    container_name: enterprise-ai-qdrant
    restart: unless-stopped

    env_file:
      - .env

    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}

    volumes:
      - qdrant_data:/qdrant/storage

    networks:
      - enterprise-ai-network

  pgadmin:
    image: dpage/pgadmin4:9.16
    container_name: enterprise-ai-pgadmin
    restart: unless-stopped

    env_file:
      - .env

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}

    ports:
      - "127.0.0.1:${PGADMIN_PORT}:80"

    volumes:
      - pgadmin_data:/var/lib/pgadmin

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - enterprise-ai-network

  prometheus:
    image: prom/prometheus:v3.7.3
    container_name: enterprise-ai-prometheus
    restart: unless-stopped

    command:
      - --config.file=/etc/prometheus/prometheus.yml

    ports:
      - "127.0.0.1:9090:9090"

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus_data:/prometheus

    secrets:
      - prometheus_api_key

    networks:
      - enterprise-ai-network

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: enterprise-ai-alertmanager
    restart: unless-stopped

    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager

    ports:
      - "127.0.0.1:9093:9093"

    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager

    secrets:
      - brevo_smtp_key

    networks:
      - enterprise-ai-network

  grafana:
    image: grafana/grafana:12.2.0
    container_name: enterprise-ai-grafana
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "127.0.0.1:3000:3000"

    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro

    depends_on:
      - prometheus

    networks:
      - enterprise-ai-network

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  pgadmin_data:
  prometheus_data:
  grafana_data:
  alertmanager_data:

networks:
  enterprise-ai-network:
    driver: bridge

secrets:
  prometheus_api_key:
    file: ./prometheus/secrets/api_key

  brevo_smtp_key:
    file: ./alertmanager/secrets/smtp_key
