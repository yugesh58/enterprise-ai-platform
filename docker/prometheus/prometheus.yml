global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093
            
scrape_configs:
  - job_name: enterprise-ai-backend
    metrics_path: /metrics
    scrape_interval: 15s

    http_headers:
      X-API-Key:
        files:
          - /run/secrets/prometheus_api_key

    static_configs:
      - targets:
          - backend:8000